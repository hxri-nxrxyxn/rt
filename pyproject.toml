[project]
name = "litert-wrap"
version = "0.1.0"
description = "A developer wrapper for LiteRT-LM models with OpenAI-compatible serving."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "huggingface-hub>=1.14.0",
    "litert-lm-api-nightly>=0.11.0.dev20260422",
    "pydantic>=2.13.4",
    "textual>=8.2.5",
    "typer>=0.25.1",
    "uvicorn>=0.46.0",
]

[project.scripts]
litert-wrap = "litert_wrap.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
